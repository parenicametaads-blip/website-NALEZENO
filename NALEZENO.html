<script type="text/babel">
const __TWEAKS_STYLE = `

  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;box-sizing:border-box;width:100%;min-width:0;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  select.twk-field{padding-right:22px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center}
  .twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;margin:6px 0;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);

  if (!fitsAsSegments) {
    return (
      <TweakRow label={label}>
        <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
          {options.map((o) => {
            const v = typeof o === 'object' ? o.value : o;
            const l = typeof o === 'object' ? o.label : o;
            return <option key={v} value={v}>{l}</option>;
          })}
        </select>
      </TweakRow>
    );
  }

  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRow, TweakRadio });
</script>

<script type="text/babel">
function useReveal(threshold = 0.15) {
  const ref = React.useRef(null);
  const [shown, setShown] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (shown) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setShown(true);
      return;
    }
    const io = new IntersectionObserver(
      (entries) => {
        for (const e of entries) {
          if (e.isIntersecting) { setShown(true); io.disconnect(); break; }
        }
      },
      { threshold, rootMargin: '0px 0px -8% 0px' }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [shown, threshold]);
  return [ref, shown];
}

function Reveal({ children, delay = 0, y = 18, as = 'div', style, ...rest }) {
  const [ref, shown] = useReveal();
  const Tag = as;
  return (
    <Tag
      ref={ref}
      style={{
        opacity: shown ? 1 : 0,
        transform: shown ? 'translateY(0)' : `translateY(${y}px)`,
        transition: `opacity .9s cubic-bezier(.2,.7,.2,1) ${delay}ms, transform .9s cubic-bezier(.2,.7,.2,1) ${delay}ms`,
        willChange: 'opacity, transform',
        ...style,
      }}
      {...rest}
    >
      {children}
    </Tag>
  );
}

function useContactForm(t) {
  const [vals, setVals] = React.useState({ name: '', email: '', company: '', message: '' });
  const [errs, setErrs] = React.useState({});
  const [status, setStatus] = React.useState('idle');

  const set = (k) => (e) => {
    setVals((v) => ({ ...v, [k]: e.target.value }));
    if (errs[k]) setErrs((er) => ({ ...er, [k]: undefined }));
  };

  const validate = () => {
    const e = {};
    if (!vals.name.trim()) e.name = t.contact.errors.name;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(vals.email.trim())) e.email = t.contact.errors.email;
    if (vals.message.trim().length < 10) e.message = t.contact.errors.message;
    return e;
  };

  const submit = (e) => {
    e.preventDefault();
    const e2 = validate();
    setErrs(e2);
    if (Object.keys(e2).length) return;
    setStatus('sending');
    setTimeout(() => {
      setStatus('sent');
      setVals({ name: '', email: '', company: '', message: '' });
    }, 850);
  };

  return { vals, errs, status, set, submit };
}

            fill={i < n ? color : 'rgba(0,0,0,.12)'}

      ))}
    </span>
  );
}

}

function GoogleG({ size = 14 }) {

function BField({ label, value, onChange, error, multiline, type = 'text', name, code }) {
  const [focus, setFocus] = React.useState(false);
  const id = 'fb-' + name;
  return (
    <div style={dirBFieldWrap}>
      <div style={dirBFieldLabelRow}>
        <span style={dirBFieldCode}>[{code}]</span>
        <label htmlFor={id} style={dirBFieldLabel}>{label}</label>
      </div>
      {multiline ? (
        <textarea
          id={id}
          name={name}
          value={value}
          onChange={onChange}
          onFocus={() => setFocus(true)}
          onBlur={() => setFocus(false)}
          rows={4}
          style={{
            ...dirBFieldInput,
            minHeight: 112, resize: 'vertical',
            borderColor: error ? '#0a0a0a' : focus ? '#0a0a0a' : 'rgba(0,0,0,.2)',
          }}
        />
      ) : (
        <input
          id={id}
          name={name}
          type={type}
          value={value}
          onChange={onChange}
          onFocus={() => setFocus(true)}
          onBlur={() => setFocus(false)}
          style={{
            ...dirBFieldInput,
            borderColor: error ? '#0a0a0a' : focus ? '#0a0a0a' : 'rgba(0,0,0,.2)',
          }}
        />
      )}
      {error && (
        <p style={dirBFieldError}>
          <span style={{ opacity: .6 }}>// error: </span>{error}
        </p>
      )}
    </div>
  );
}

}

<script type="text/babel">
const TWEAK_DEFAULTS = {
  "direction": "A",
  "lang": "en",
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const direction = t.direction;
  const lang = t.lang;
  const setDirection = (d) => setTweak('direction', d);
  const setLang = (l) => setTweak('lang', l);

  const i18n = I18N[lang] || I18N.en;

  const switcher = (
    <div style={swStyles.wrap} aria-label="Design direction">
      <span style={swStyles.label}>VIEW</span>
      {['A', 'B'].map((d) => (
        <button
          key={d}
          onClick={() => setDirection(d)}
          style={{
            ...swStyles.btn,
            ...(direction === d ? swStyles.btnActive : null),
          }}
          aria-pressed={direction === d}
        >
          {d}
        </button>
      ))}
      <span style={swStyles.divider} />
      {['en', 'cs'].map((l) => (
        <button
          key={l}
          onClick={() => setLang(l)}
          style={{
            ...swStyles.btn,
            ...(lang === l ? swStyles.btnActive : null),
          }}
          aria-pressed={lang === l}
        >
          {l.toUpperCase()}
        </button>
      ))}
    </div>
  );

  const onToggleLang = () => setLang(lang === 'en' ? 'cs' : 'en');

  return (
    <>
      {switcher}

      <div
        key={direction}
        style={{ animation: 'fadein .35s ease both' }}
      >
        {direction === 'A'
          ? <DirectionA t={i18n} lang={lang} onToggleLang={onToggleLang} />
          : <DirectionB t={i18n} lang={lang} onToggleLang={onToggleLang} />}
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Direction">
          <TweakRadio
            label="View"
            value={direction}
            onChange={(v) => setDirection(v)}
            options={[
              { value: 'A', label: 'Editorial' },
              { value: 'B', label: 'System' },
            ]}
          />
        </TweakSection>

        <TweakSection label="Language">
          <TweakRadio
            label="Locale"
            value={lang}
            onChange={(v) => setLang(v)}
            options={[
              { value: 'en', label: 'English' },
              { value: 'cs', label: 'Čeština' },
            ]}
          />
        </TweakSection>

        <TweakSection label="Notes">
          <div style={{ fontSize: 12, lineHeight: 1.55, opacity: .75 }}>
            <p style={{ margin: 0 }}>Reviews are mocked. Connect your Google Business Profile Place ID to render a live feed. Contact form submit is also mocked — point it at your endpoint (Formspree, Resend, etc.) before going live.</p>
          </div>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

const swStyles = {
  wrap: {
    position: 'fixed', bottom: 20, left: '50%', transform: 'translateX(-50%)',
    zIndex: 50,
    display: 'flex', alignItems: 'center', gap: 6,
    background: 'rgba(10,10,10,.92)', color: '#fff',
    backdropFilter: 'blur(8px)',
    border: '1px solid rgba(255,255,255,.12)',
    borderRadius: 999,
    padding: '6px 10px 6px 16px',
    boxShadow: '0 12px 40px rgba(0,0,0,.18)',
    fontFamily: '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace',
    fontSize: 11, letterSpacing: '.08em',
  },
  label: { opacity: .5, marginRight: 6 },
  btn: {
    border: 0, background: 'transparent',
    padding: '6px 10px',
    fontFamily: 'inherit', fontSize: 11, letterSpacing: '.08em',
    cursor: 'pointer', color: '#fff',
    borderRadius: 999,
  },
  btnActive: { background: '#fff', color: '#0a0a0a' },
  divider: { width: 1, height: 16, background: 'rgba(255,255,255,.18)', margin: '0 4px' },
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
